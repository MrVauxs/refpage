# Coolify: New Resource -> your repository -> Build Pack: Docker Compose.
#
# The domain is set in Coolify's UI (Configuration -> Domains), not here.
services:
  refpage:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      # Coolify generates the domain and points its proxy at port 3000
      - SERVICE_FQDN_REFPAGE_3000
      - ALLOWED_HOSTS=$SERVICE_FQDN_REFPAGE_3000
      # Generated once by Coolify and kept, so sessions survive redeploys.
      # Override it in the UI to bring your own.
      - BETTER_AUTH_SECRET=$SERVICE_PASSWORD_BETTERAUTH
      # Who may create an account. Blank allows anyone.
      - ALLOWED_EMAILS=${ALLOWED_EMAILS:-}
      # Default is 512K, far too small for image uploads
      - BODY_SIZE_LIMIT=${BODY_SIZE_LIMIT:-25M}
      # Optional — GitHub sign-in is only enabled when both are set
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
    volumes:
      # SQLite database, uploaded images and the generated auth secret
      - refpage-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  refpage-data:
