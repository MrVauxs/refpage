# Coolify: New Resource -> your repository -> Build Pack: Docker Compose.
#
# The domain is set in Coolify's UI (Configuration -> Domains), not here.
services:
  refpage:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - '3000'
    volumes:
      # SQLite database, uploaded images and the generated auth secret
      - refpage-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  refpage-data:
